name: Deploy

# 推送到 main 或手动触发时构建并部署站点
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Rspress site
        run: npm run build

      - name: Pack static site
        run: tar -czf doc_build.tar.gz doc_build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-build
          path: |
            doc_build
            doc_build.tar.gz
          retention-days: 3

  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: doc-build

      - name: Setup GitHub Pages
        id: pages_setup
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        id: pages_upload
        if: ${{ steps.pages_setup.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc_build

      - name: Deploy to GitHub Pages
        if: ${{ steps.pages_setup.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aliyun:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: doc-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync to Aliyun
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp doc_build.tar.gz deploy/remote-sync.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sed -i 's/\r$//' /tmp/remote-sync.sh && chmod +x /tmp/remote-sync.sh && bash /tmp/remote-sync.sh /tmp/doc_build.tar.gz /var/www/sapi-typedoc"

      - name: Healthcheck
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "http://${DEPLOY_HOST}/")
          test "$code" = "200"
          echo "healthcheck HTTP $code"
