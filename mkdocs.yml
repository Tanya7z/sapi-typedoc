site_name: Minecraft Script API 文档
site_description: 基于官方 @minecraft/*.d.ts 生成的中文 Script API 参考（sapi-typedoc）
site_url: https://sapi.dogelake.cn
repo_url: https://github.com/Tanya7z/sapi-typedoc
repo_name: Tanya7z/sapi-typedoc
edit_uri: edit/main/translated/
docs_dir: docs
site_dir: site

# 翻译源变更时触发 live reload（默认只监听 docs/）
watch:
  - translated
  - includes

theme:
  logo: logo.png
  favicon: logo.png
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    # 不启用 navigation.sections：否则二级「类/枚举」会变成不可折叠分组
    # 不启用 navigation.expand：全量展开继承树会导致侧栏过长、无法滚到底
    # 不启用 navigation.prune：保证分组始终用 Material 原版 icon（与展开态一致）
    - navigation.indexes
    - navigation.paths
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/sidebar-scroll.css

plugins:
  - search:
      lang:
        - zh
        - en
  - tags
  - awesome-pages

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      # 路径相对 mkdocs 工作目录（仓根）；前导 / 会被当成文件系统绝对路径导致 abbr 静默失效
      base_path:
        - .
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Tanya7z/sapi-typedoc
  generator: false
  analytics:
    provider: google
    property: G-EBV9ZXZG07
    feedback:
      title: 这个网站帮到你了吗ヾ(≧▽≦*)o
      ratings:
        - icon: material/emoticon-happy-outline
          name: 有用
          data: 1
          note: >-
            谢谢泥(/≧▽≦)/
        - icon: material/emoticon-sad-outline
          name: 还能改进
          data: 0
          note: >-
            我会努力的！(≧∇≦)ﾉ

validation:
  absolute_links: ignore
  unrecognized_links: ignore
  # 锚点校验对 1000+ 页代价很高；链接有效性已由构建流程保证
  anchors: ignore
