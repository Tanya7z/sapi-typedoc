# 有证书时使用本 HTTPS 配置；无证书时可用 setup-ssl.sh 申请。
server {
    listen 80;
    listen [::]:80;
    server_name sapi.dogelake.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sapi.dogelake.cn;

    ssl_certificate /etc/letsencrypt/live/sapi.dogelake.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sapi.dogelake.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sapi-typedoc;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/xml text/markdown;
    gzip_min_length 1024;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sapi-typedoc;
        default_type "text/plain";
        try_files $uri =404;
    }

    # SEO / AI 入口：禁止回落到 index.html
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # MCP Streamable HTTP（Node 服务监听 127.0.0.1:3921）
    location /mcp {
        proxy_pass http://127.0.0.1:3921;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
